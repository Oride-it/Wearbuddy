name: Signed release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and verify'
        required: true
        default: 'v1.0.9'
        type: string
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/wearbuddy-release.jks
      - name: Test and build signed Release with R8
        env:
          WEARBUDDY_STORE_FILE: keystore/wearbuddy-release.jks
          WEARBUDDY_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          WEARBUDDY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WEARBUDDY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew :wear:testDebugUnitTest :wear:assembleRelease --console=plain
      - name: Verify and prepare assets
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose wear/build/outputs/apk/release/wear-release.apk
          python scripts/prepare_release.py --tag "$RELEASE_TAG"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-draft.txt"; then
            if grep -qx false "$RUNNER_TEMP/release-draft.txt"; then
              echo "Release already published; signed build verified without replacing public assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Wearbuddy $RELEASE_TAG" --notes-file "docs/releases/${RELEASE_TAG#v}.md"
          fi
          gh release upload "$RELEASE_TAG" "dist/Wearbuddy-$RELEASE_TAG-release.apk" dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-${{ env.RELEASE_TAG }}
          path: dist/
          retention-days: 30
      - name: Remove runner signing material
        if: always()
        run: rm -f keystore/wearbuddy-release.jks
