name: Signed release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/wearbuddy-release.jks
      - name: Test and build signed Release with R8
        env:
          WEARBUDDY_STORE_FILE: keystore/wearbuddy-release.jks
          WEARBUDDY_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          WEARBUDDY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WEARBUDDY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew :wear:testDebugUnitTest :wear:assembleRelease --console=plain
      - name: Verify and prepare assets
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose wear/build/outputs/apk/release/wear-release.apk
          python scripts/prepare_release.py --tag "$GITHUB_REF_NAME"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Wearbuddy $GITHUB_REF_NAME" --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md"
          gh release upload "$GITHUB_REF_NAME" "dist/Wearbuddy-$GITHUB_REF_NAME-release.apk" dist/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Remove runner signing material
        if: always()
        run: rm -f keystore/wearbuddy-release.jks
